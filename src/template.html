<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DYNAMIC Data Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js" integrity="sha384-SM54CE5h+qdDI046d2Y5ym7wq1kq4uxcQ1cqGq5/+5jrE5tPLeDJSq711Q8sIska" crossorigin="anonymous"></script>
<style>
/* Layout: a library catalogue. Sticky header + one filter rail scoping every view; dataset is the unit, each carries a fixed-position modality fingerprint.
   Theme: Ayu Light Bordered (ayu@8.0.1 light.js): one editor surface, ui.line hairlines, orange common.accent. Type: Geist / Geist Mono. Single light theme by choice. */
:root{
  --paper:#FCFCFC; --ink:#5C6166; --strong:#2E3338; --muted:#787B80; --faint:#ADAEB1; --rule:#6B7D8F1F; --rule2:#6B7D8F14; --ctl:#6B7D8F40;
  --accent:#FFAA33; --accent-ink:#9A5B00; --link:#2A7DBB; --mark:#399EE6; --soft:#FFAA3326; --sel:#56728F1F; --warn:#B86A14; --warnbg:#FA8D3E1F; --ok:#3F8A1F;
  --f-img:#399EE6; --f-ephys:#FA8D3E; --f-digital:#4CBF99; --f-bio:#A37ACC; --f-clin:#86B300; --f-cog:#55B4D4; --f-lang:#F07171;
  --display:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--link)}
h1,h2,h3{color:var(--strong);text-wrap:balance;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}
header.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{display:flex;gap:18px;align-items:center;padding:10px 24px;max-width:1440px;margin:0 auto;flex-wrap:wrap}
.top-in h1{font-size:17px;font-weight:600;white-space:nowrap}
h1{font:600 17px/1.15 var(--display);letter-spacing:-.02em}
.brandlogos{display:flex;align-items:center;gap:14px}
.brandlogos img{height:30px;width:auto;display:block;mix-blend-mode:multiply}
.top-in .lw{height:34px;width:auto;mix-blend-mode:multiply}
.sitenav{display:inline-flex;gap:3px;border:1px solid var(--ctl);border-radius:9px;padding:3px;background:var(--paper)}
.sitenav a{padding:6px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;white-space:nowrap}
.sitenav a:hover{background:var(--sel)}
.sitenav a.on{background:var(--soft);color:var(--strong);box-shadow:inset 0 0 0 1.5px var(--accent)}
.top-in .lw{margin-left:auto}
nav.ch{display:flex;flex-direction:column;gap:3px}
nav.ch a{padding:10px 12px;text-decoration:none;color:var(--ink);border-left:3px solid transparent;font-size:14.5px;font-weight:600;border-radius:0 8px 8px 0}
nav.ch a:hover{color:var(--strong);background:var(--sel)} nav.ch a.on{color:var(--strong);border-left-color:var(--accent);background:var(--soft)}
.wrap{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:8px}
aside.side{padding:28px 10px 40px 24px;position:sticky;top:60px;align-self:start}
.sidet{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 12px}
main{padding:28px 24px 60px;min-width:0;display:flex;flex-direction:column;gap:14px}
.eyebrow{font:500 12px var(--mono);color:var(--accent-ink);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.claim{font-size:26px;line-height:1.15;font-weight:600;color:var(--strong);max-width:28ch;letter-spacing:-.025em;margin:0}
.claim .hi{color:var(--accent-ink)}
.lede{max-width:70ch;margin:10px 0 6px;color:var(--ink);font-size:15px}
/*__FILTERBAR_CSS__*/
.answer{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--rule2)}
.answer b{font:600 22px/1 var(--body);color:var(--strong);letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--ctl);background:var(--paper);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
.chip:hover{background:var(--sel)}
.chip.on{background:var(--soft);border-color:var(--accent);color:var(--strong)}
.chip .x{color:var(--muted)} .chip.fil{background:var(--soft);border-color:transparent;color:var(--strong)}
.lnk{background:none;border:0;padding:0;color:var(--link);cursor:pointer;font-size:12px;text-decoration:underline}
.search{padding:7px 10px;border:1px solid var(--ctl);border-radius:7px;background:var(--paper)}
.panel{border:1px solid var(--rule);border-radius:10px;padding:14px;min-width:0}
.panel>header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:8px}
.panel h2{font:600 15px/1.25 var(--display);letter-spacing:-.01em}
.hint{font-size:12px;color:var(--muted);max-width:75ch}
.grid2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.scroll{overflow-x:auto}
.tile{border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.tile b{display:block;font:600 28px/1.1 var(--body);letter-spacing:-.03em;color:var(--strong)}
.tile span{font-size:12px;color:var(--muted)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(308px,1fr))}
.card{border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--paper);text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card.sl{box-shadow:inset 0 0 0 1px var(--accent)}
.card h3{font:600 15px/1.25 var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}
.card .stat{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.card .stat b{font:500 18px var(--mono);color:var(--strong)}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.tag.t1{border-color:var(--accent);color:var(--accent-ink)}
.tag.warn{border-color:transparent;background:var(--warnbg);color:var(--warn)}
.tag.btn{cursor:pointer;background:var(--paper)} .tag.btn:hover{background:var(--sel)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.slbtn{border:1px solid var(--ctl);background:var(--paper);border-radius:5px;font-size:11px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.slbtn.on{background:var(--soft);border-color:var(--accent);color:var(--strong)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:var(--paper);text-align:left;font-weight:600;font-size:12px;color:var(--muted);border-bottom:1px solid var(--rule);padding:5px 8px;white-space:nowrap}
table.t th[data-sort]{cursor:pointer} table.t th[data-sort]:hover{color:var(--strong)}
table.t td{border-bottom:1px solid var(--rule2);padding:5px 8px;vertical-align:top}
table.t tr.cl{cursor:pointer} table.t tr.cl:hover td{background:var(--sel)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
svg text{font-family:var(--body);fill:var(--ink)}
svg .mono{font-family:var(--mono)}
.hit{cursor:pointer}
#tt{position:fixed;z-index:60;pointer-events:none;background:var(--strong);color:#fff;font-size:12px;line-height:1.35;padding:6px 8px;border-radius:6px;max-width:330px;display:none}
#tt b{color:#fff}
.scrim{position:fixed;inset:0;background:#2E33382e;z-index:40;display:none}
.scrim.on{display:block}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--paper);border-left:1px solid var(--rule);z-index:50;transform:translateX(102%);transition:transform .16s;overflow:auto;padding:18px 20px 40px;visibility:hidden}
aside.drawer.on{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){aside.drawer{transition:none}}
aside.drawer h2{font:600 21px/1.2 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
aside.drawer h3{font:600 14px var(--body);margin:16px 0 6px}
.close{float:right;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:2px 9px;cursor:pointer}
.box{border:1px solid var(--rule);border-radius:8px;padding:9px 11px;margin:7px 0}
blockquote{margin:6px 0 0;padding:0 0 0 9px;border-left:2px solid var(--rule);font-size:12.5px;color:var(--ink)}
.notice{background:var(--warnbg);border-radius:8px;padding:8px 11px;font-size:13px;color:#7A4A10}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:3px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--strong);color:#fff;padding:7px 12px;border-radius:7px;z-index:70;font-size:13px;display:none}
.toast.on{display:block}
dialog{border:1px solid var(--rule);border-radius:10px;max-width:640px;width:90%}
dialog textarea{width:100%;height:240px;font:12px var(--mono)}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.field select,.field input{width:100%;padding:5px 7px;border:1px solid var(--ctl);border-radius:6px;background:var(--paper)}
.planbar{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.more{display:block;margin:10px auto 0;padding:5px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);cursor:pointer}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.empty{padding:26px;text-align:center;color:var(--muted)}
@media(max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr)}aside.side{position:static;padding:14px 16px 0}nav.ch{flex-direction:row;flex-wrap:wrap}nav.ch a{border-left:0;border-bottom:3px solid transparent;border-radius:7px 7px 0 0}nav.ch a.on{border-bottom-color:var(--accent)}.grid2{grid-template-columns:minmax(0,1fr)}main{padding:16px 16px 40px}.top-in{padding:10px 16px}}
@media(max-width:1000px){header.top{position:static}}
/*__SHELL_CSS__*/
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brandlogos"><img src="/*__LOGO_DYN__*/" alt="DYNAMIC"><div class="brandname"><h1>Data Catalogue <span class="ver">v/*__VERSION__*/</span></h1><span class="tagline">Every cohort, data type and participant behind the DYNAMIC papers</span></div></div><img class="lw" src="/*__LOGO_LOEWE__*/" alt="LOEWE: Exzellente Forschung für Hessens Zukunft"></div></header>
<div class="subbar"><div class="subbar-in"><span class="src" id="src"></span><nav class="sitenav" id="sitenav" aria-label="Site"></nav></div></div>
<div class="wrap">
  <aside class="side"><div class="sidet">Views</div><nav class="ch" aria-label="Views" id="tabs"></nav></aside>
  <main>
    <div id="vh"></div>
    <div class="fbwrap"><div class="fblabel">Search and filter</div><div class="fbrow"><input id="q" class="search" type="search" placeholder="Search datasets, authors, instruments" aria-label="Search"><span id="facets"></span></div><div id="fbpop"></div></div>
    <div class="chips" id="active"></div>
    <div class="answer" id="answer"></div>
    <div id="view" style="display:flex;flex-direction:column;gap:14px;min-width:0"></div>
    <p class="small muted" id="foot" style="max-width:90ch;margin:10px 0 0"></p>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Details"></aside>
<div id="tt" role="tooltip"></div>
<div class="toast" id="toast" role="status"></div>
<dialog id="copydlg"><p class="small">Copying was blocked here. Select the text and copy it yourself.</p><textarea id="copytxt" aria-label="Text to copy"></textarea><p><button class="slbtn" id="copyclose">Close</button></p></dialog>
<script>
/*__SHELL_JS__*/
const D=/*__DATA__*/null;
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const fmt=n=>n==null?"–":Math.round(n).toLocaleString("en");
const uniq=a=>[...new Set(a)];
const PAP=Object.fromEntries(D.papers.map(p=>[p.id,p]));
const DSB=Object.fromEntries(D.datasets.map(d=>[d.id,d]));
const S=D.samples;
S.forEach(s=>{s.P=PAP[s.p];s.D=DSB[s.ds]});
const FAM=D.families;
const FAMOF={},MODCOL={};FAM.forEach(f=>f.m.forEach(m=>{FAMOF[m]=f.id;MODCOL[m]=`var(--f-${f.id})`}));
const FAML=Object.fromEntries(FAM.map(f=>[f.id,f.l]));const FCOL=Object.fromEntries(FAM.map(f=>[f.id,`var(--f-${f.id})`]));
const MODS=FAM.flatMap(f=>f.m);
const POOL=new Set(["Consortium","Registry","Meta-analysis pool"]);
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)};
async function copy(txt,msg){try{await navigator.clipboard.writeText(txt);toast(msg||"Copied")}catch(e){$("copytxt").value=txt;$("copydlg").showModal()}}
$("copyclose").onclick=()=>$("copydlg").close();
/* fingerprint: one square per modality, fixed position, grouped by family: same place on every dataset */
function fp(mods,sz=9){const has=new Set(mods);let x=0,o="";const g=2,gg=7;
  FAM.forEach(f=>{f.m.forEach(m=>{o+=`<rect x="${x}" y="0" width="${sz}" height="${sz}" rx="1.5" fill="${has.has(m)?`var(--f-${f.id})`:"var(--rule2)"}"${has.has(m)?"":` stroke="var(--rule)" stroke-width=".5"`}><title>${esc(m)}${has.has(m)?"":" (not used)"}</title></rect>`;x+=sz+g});x+=gg-g});
  return `<svg width="${x}" height="${sz}" role="img" aria-label="Modalities: ${esc(mods.join(", ")||"none")}">${o}</svg>`}
function fpKey(){return `<div class="legend">${FAM.map(f=>`<span><i style="background:var(--f-${f.id})"></i>${esc(f.l)}</span>`).join("")}</div>`}
/* ---------- filter state ---------- */
const FIELDS=[
 ["cond","Condition",s=>s.c],["kind","Dataset type",s=>[s.k]],["age","Age group",s=>[s.ag]],["design","Study design",s=>[s.P.de]],
 ["rec","Recruitment",s=>[s.rec]],["reuse","Data origin",s=>[s.re]],["access","Data access",s=>[s.P.ac]],["approach","Analytic approach",s=>s.P.ap],
 ["ctry","Country",s=>s.ct],["year","Year",s=>[String(s.P.y)]]];
const FL=Object.fromEntries(FIELDS.map(f=>[f[0],f[1]]));
const blank=()=>{const f={mods:new Set(),modMode:"any",fam:new Set(),text:"",nmin:null,nmax:null,lon:false,tab1:false,ds:new Set()};FIELDS.forEach(x=>f[x[0]]=new Set());return f};
let F=blank();
const sl=new Set(); // shortlist of dataset ids
function match(s,skip){
  for(const [k,,g] of FIELDS){if(k===skip||!F[k].size)continue;if(!g(s).some(v=>F[k].has(v)))return false}
  if(skip!=="mods"&&F.mods.size){const has=[...F.mods].map(m=>s.m.includes(m));if(F.modMode==="all"?!has.every(Boolean):!has.some(Boolean))return false}
  if(skip!=="fam"&&F.fam.size&&!s.m.some(m=>F.fam.has(FAMOF[m])))return false;
  if(F.ds.size&&skip!=="ds"&&!F.ds.has(s.ds))return false;
  if(F.nmin!=null&&(s.n==null||s.n<F.nmin))return false;
  if(F.nmax!=null&&(s.n==null||s.n>F.nmax))return false;
  if(F.lon&&!s.lon)return false;
  if(F.tab1&&!s.D.tab1)return false;
  if(F.text){const h=(s.D.name+" "+(s.nm||"")+" "+s.P.t+" "+s.P.au+" "+s.P.j+" "+s.P.pmid+" "+s.ins.join(" ")+" "+s.P.tp).toLowerCase();if(!F.text.toLowerCase().split(/\s+/).every(w=>h.includes(w)))return false}
  return true}
const sel=()=>S.filter(s=>match(s));
function toggle(k,v){F[k].has(v)?F[k].delete(v):F[k].add(v);render()}
/* ---------- aggregation ---------- */
function agg(samples){const m=new Map();samples.forEach(s=>{(m.get(s.ds)||m.set(s.ds,[]).get(s.ds)).push(s)});
  return [...m.entries()].map(([id,ss])=>{const d=DSB[id],ns=ss.map(x=>x.n).filter(x=>x!=null),big=ss.filter(x=>x.n!=null).sort((a,b)=>b.n-a.n)[0]||ss[0],fs=ss.filter(x=>x.f!=null&&x.n).sort((a,b)=>b.n-a.n)[0]||ss.find(x=>x.f!=null),ag=ss.filter(x=>x.am!=null||x.a0!=null);
    return{id,d,ss,n:ns.length?Math.max(...ns):null,big,papers:uniq(ss.map(x=>x.p)),years:uniq(ss.map(x=>x.P.y)).sort(),mods:uniq(ss.flatMap(x=>x.m)),conds:uniq(ss.flatMap(x=>x.c)),ins:uniq(ss.flatMap(x=>x.insn)),f:fs?fs.f:null,a0:ag.length&&ag.some(x=>x.a0!=null)?Math.min(...ag.filter(x=>x.a0!=null).map(x=>x.a0)):null,a1:ag.length&&ag.some(x=>x.a1!=null)?Math.max(...ag.filter(x=>x.a1!=null).map(x=>x.a1)):null,am:(ag.find(x=>x.am!=null)||{}).am??null,lon:ss.some(x=>x.lon),pool:POOL.has(d.kind)||d.pool}})}
const deDup=ag=>ag.filter(a=>!a.pool&&a.n!=null).reduce((t,a)=>t+a.n,0);
const ageText=a=>a.a0!=null&&a.a1!=null?`${a.a0}–${a.a1} y`:a.a0!=null?`from ${a.a0} y`:a.a1!=null?`up to ${a.a1} y`:a.am!=null?`mean ${a.am} y`:"age not reported";
const nameOf=d=>d.name;
/* ---------- facets ---------- */
const FB_RENDER=()=>render();
/*__FILTERBAR__*/
function renderActive(){const c=[];
  F.mods.forEach(v=>c.push(["mods",v,"Modality"]));F.fam.forEach(v=>c.push(["fam",v,"Family",FAML[v]]));
  FIELDS.forEach(([k,l])=>F[k].forEach(v=>c.push([k,v,l])));
  F.ds.forEach(v=>c.push(["ds",v,"Dataset",DSB[v].name]));
  let o=c.map(([k,v,l,show])=>`<button class="chip fil" data-tog="${k}" data-v="${esc(v)}"><span class="muted">${esc(l)}</span> ${esc(show||v)} <span class="x" aria-hidden="true">×</span><span class="vh" style="position:absolute;left:-9999px">remove</span></button>`).join("");
  if(F.nmin!=null||F.nmax!=null)o+=`<button class="chip fil" data-clr="n"><span class="muted">n</span> ${F.nmin??0}–${F.nmax??"∞"} <span class="x">×</span></button>`;
  if(F.lon)o+=`<button class="chip fil" data-clr="lon">Longitudinal <span class="x">×</span></button>`;
  if(F.tab1)o+=`<button class="chip fil" data-clr="tab1">Tab. 1 datasets <span class="x">×</span></button>`;
  if(F.text)o+=`<button class="chip fil" data-clr="text"><span class="muted">Text</span> ${esc(F.text)} <span class="x">×</span></button>`;
  const any=o!=="";
  o+=RECIPES.map((r,i)=>`<button class="chip" data-recipe="${i}">${esc(r[0])}</button>`).join("");
  if(any)o+=`<button class="lnk" data-clr="all">Clear all</button>`;
  $("active").innerHTML=o}
const RECIPES=[
 ["Depression × sMRI",()=>{F.cond.add("Major depression");F.mods.add("sMRI")}],
 ["Any EMA",()=>{F.mods.add("EMA")}],
 ["Speech or video",()=>{F.mods.add("Speech/language");F.mods.add("Video/nonverbal")}],
 ["Children & adolescents",()=>{["Children","Adolescents","Youth (mixed)"].forEach(a=>F.age.add(a))}],
 ["Open data",()=>{F.access.add("Open repository")}],
 ["Longitudinal, n ≥ 500",()=>{F.lon=true;F.nmin=500}],
];
function renderAnswer(){const ss=sel(),a=agg(ss),ps=uniq(ss.map(s=>s.p)),pl=a.filter(x=>x.pool).length,nm=a.filter(x=>x.d.named).length;

function vMethod(){const m=D.meta,q=m.qc,a=m.agree;
 $("view").innerHTML=`<div class="grid3"><div class="tile"><b>${m.papers}</b><span>papers in snapshot ${esc(m.snapshot)}</span></div><div class="tile"><b>${q.quotes}</b><span>verbatim quotes, all found in the source text by machine</span></div><div class="tile"><b>${m.fulltext}</b><span>papers read from full text; ${m.papers-m.fulltext} abstract or metadata only</span></div><div class="tile"><b>${a?a.n_exact+"%":"–"}</b><span>of largest n repeated exactly in a blind second extraction of ${a?a.papers:"–"} papers</span></div></div>
 <section class="panel"><header><h2>How to read these numbers</h2></header><div style="max-width:72ch;display:flex;flex-direction:column;gap:8px">
 <p style="margin:0"><b style="color:var(--strong)">Analysed, not collected.</b> Sample sizes are what a paper analysed. A cohort's real size may be larger, and Vollantrag Tab. 1 gives its planned size.</p>
 <p style="margin:0"><b style="color:var(--strong)">Participants are never summed across papers.</b> Totals take the largest n per dataset. Consortia, registries and meta-analytic pools are listed but not counted. Overlap between different datasets is not checked, so the total is an upper bound.</p>
 <p style="margin:0"><b style="color:var(--strong)">Every number has a source.</b> Sample sizes, sex and age sit inside a quote that a script found in the paper. Numbers computed from counts are marked as derived. The quote proves the sentence exists, not that it was read correctly. The second extraction below tests repeatability only, so spot-check any number you plan to rely on.</p>
 <p style="margin:0"><b style="color:var(--strong)">Access is what the paper states.</b> It is no statement of what the holder would share today. Holders come from Tab. 1; for other datasets the page shows the latest paper's last author as a starting point.</p>
 <p style="margin:0"><b style="color:var(--strong)">Preprints are excluded</b>, as in the rest of the DYNAMIC library.</p></div></section>
 <section class="panel"><header><h2>Second extraction, ${a?a.papers:"–"} randomly chosen papers</h2><span class="hint">A second agent read the same text packets without seeing the first result. Same model, same packets, so this measures repeatability: errors both make stay invisible. A later hand scan of the full texts corrected 12 dataset links and added 4 links from named cohorts into consortium or derived samples; this check flagged none of them, and for BANDA both passes made the same mistake.</span></header>${a?`<table class="t" style="max-width:720px"><thead><tr><th>Field</th><th class="n">Agreement</th><th>How measured</th></tr></thead><tbody>${a.rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="n">${r[1]}%</td><td class="small muted">${esc(r[2])}</td></tr>`).join("")}</tbody></table>`:`<p class="small muted">Not available.</p>`}</section>
 <section class="panel"><header><h2>Known gaps</h2></header><ul style="margin:0;padding-left:18px;max-width:75ch">${m.gaps.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></section>
 <section class="panel"><header><h2>What this mockup takes from the atlas proposals, and what it adds</h2></header><div class="scroll"><table class="t"><thead><tr><th>Idea</th><th>Source</th><th>Here</th></tr></thead><tbody>${m.lineage.map(r=>`<tr><td>${esc(r[0])}</td><td class="small muted">${esc(r[1])}</td><td class="small">${esc(r[2])}</td></tr>`).join("")}</tbody></table></div></section>`}
