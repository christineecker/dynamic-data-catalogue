<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DYNAMIC Data Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<style>
/* Layout: a scrolling story. One hero visual holds every analysed sample; chapters below each make one claim with one chart.
   Theme: Ayu Light Bordered (ayu@8.0.1 light.js): #FCFCFC surface, ui.line hairlines, orange common.accent. Type: Geist / Geist Mono. Single light theme. */
:root{
  --paper:#FCFCFC; --ink:#5C6166; --strong:#2E3338; --muted:#787B80; --faint:#ADAEB1; --rule:#6B7D8F1F; --rule2:#6B7D8F14; --ctl:#6B7D8F40;
  --accent:#FFAA33; --accent-ink:#9A5B00; --link:#2A7DBB; --soft:#FFAA3326; --sel:#56728F1F; --warn:#B86A14; --warnbg:#FA8D3E1F;
  --f-img:#399EE6; --f-ephys:#FA8D3E; --f-digital:#4CBF99; --f-bio:#A37ACC; --f-clin:#86B300; --f-cog:#55B4D4; --f-lang:#F07171;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--link)}
h1,h2,h3{color:var(--strong);text-wrap:balance;margin:0;letter-spacing:-.02em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
header.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{display:flex;gap:18px;align-items:center;padding:10px 24px;max-width:1440px;margin:0 auto;flex-wrap:wrap}
.top-in h1{font-size:17px;font-weight:600;white-space:nowrap}
.sitenav{display:inline-flex;gap:3px;border:1px solid var(--ctl);border-radius:9px;padding:3px;background:var(--paper)}
.sitenav a{padding:6px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;white-space:nowrap}
.sitenav a:hover{background:var(--sel)}
.sitenav a.on{background:var(--soft);color:var(--strong);box-shadow:inset 0 0 0 1.5px var(--accent)}
nav.ch{display:flex;gap:4px;flex-wrap:wrap;flex-basis:100%;margin:2px 0 -11px}
nav.ch:empty{display:none}
nav.ch a{padding:9px 14px;text-decoration:none;color:var(--ink);border-bottom:3px solid transparent;font-size:14.5px;font-weight:600;border-radius:7px 7px 0 0}
nav.ch a:hover{color:var(--strong);background:var(--sel)} nav.ch a.on{color:var(--strong);border-bottom-color:var(--accent);background:var(--soft)}
main{max-width:1440px;margin:0 auto;padding:0 24px 80px}
section.chapter{padding:56px 0 28px;border-bottom:1px solid var(--rule)}
section.chapter:last-of-type{border-bottom:0}
.eyebrow{font:500 12px var(--mono);color:var(--accent-ink);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.claim{font-size:30px;line-height:1.15;font-weight:600;color:var(--strong);max-width:24ch;letter-spacing:-.025em}
.claim .hi{color:var(--accent-ink)}
.lede{max-width:66ch;margin:12px 0 22px;color:var(--ink);font-size:15.5px}
.lede b{color:var(--strong);font-weight:600}
.hero{padding-top:28px}
.hero .claim{font-size:40px;max-width:20ch}
.herohead{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:18px}
.herohead .lede{margin:0}
@media(max-width:860px){.herohead{grid-template-columns:minmax(0,1fr)}}
.herogrid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 6px}
.stat{border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:600 30px/1.05 var(--body);color:var(--strong);letter-spacing:-.03em}
.stat span{font-size:12.5px;color:var(--muted);display:block;margin-top:4px}
.viz{border:1px solid var(--rule);border-radius:12px;padding:14px;min-width:0;overflow:hidden}
.viz header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
.viz h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
.hint{font-size:12.5px;color:var(--muted);max-width:80ch}
.seg{display:inline-flex;border:1px solid var(--ctl);border-radius:7px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--soft);color:var(--strong);font-weight:500}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .hollow{border:1.5px dashed var(--muted);background:none}
svg text{font-family:var(--body);fill:var(--ink)}
svg .mono{font-family:var(--mono)}
.hit{cursor:pointer}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.fam-strip{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:14px}
.fam{border:1px solid var(--rule);border-left:4px solid var(--fc);border-radius:9px;padding:10px 12px}
.fam b{display:block;font-size:22px;font-weight:600;color:var(--strong);letter-spacing:-.02em}
.fam .t{font-weight:600;color:var(--strong);font-size:13px}
.fam .m{font-size:12px;color:var(--muted);margin-top:4px}
.card{border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;background:var(--paper);width:100%}
.card:hover{border-color:var(--accent)}
.card h3{font-size:19px;letter-spacing:-.02em}
.card .big{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.card .big b{font:600 26px/1 var(--body);color:var(--strong);letter-spacing:-.03em}
.card .big span{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:5px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.tag.t1{border-color:var(--accent);color:var(--accent-ink)}
.tag.warn{border-color:transparent;background:var(--warnbg);color:var(--warn)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tile{border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile .q{font-weight:600;color:var(--strong);font-size:15px}
.tile .n{font:600 28px/1 var(--body);color:var(--strong);letter-spacing:-.03em}
.tile .n small{font:500 13px var(--body);color:var(--muted);letter-spacing:0}
.tile .names{font-size:12.5px;color:var(--muted)}
.tile a{font-size:12.5px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);border-bottom:1px solid var(--rule);padding:6px 8px;white-space:nowrap;position:sticky;top:0;background:var(--paper)}
table.t td{border-bottom:1px solid var(--rule2);padding:6px 8px;vertical-align:top}
table.t tr.cl{cursor:pointer} table.t tr.cl:hover td{background:var(--sel)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.search{padding:7px 10px;border:1px solid var(--ctl);border-radius:7px;background:var(--paper)}
.scroll{overflow-x:auto}
#tt{position:fixed;z-index:60;pointer-events:none;background:var(--strong);color:#fff;font-size:12.5px;line-height:1.4;padding:7px 9px;border-radius:7px;max-width:340px;display:none}
#tt b{color:#fff}
.scrim{position:fixed;inset:0;background:#2E33382e;z-index:40;display:none} .scrim.on{display:block}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--paper);border-left:1px solid var(--rule);z-index:50;transform:translateX(102%);transition:transform .16s;overflow:auto;padding:18px 22px 40px;visibility:hidden}
aside.drawer.on{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){aside.drawer{transition:none}}
aside.drawer h2{font-size:22px} aside.drawer h3{font-size:14px;margin:16px 0 6px}
.close{float:right;border:1px solid var(--ctl);background:var(--paper);border-radius:6px;padding:2px 9px;cursor:pointer}
.box{border:1px solid var(--rule);border-radius:8px;padding:9px 11px;margin:7px 0;font-size:13px}
blockquote{margin:6px 0 0;padding:0 0 0 9px;border-left:2px solid var(--rule);font-size:12.5px;color:var(--ink)}
.notice{background:var(--warnbg);border-radius:8px;padding:8px 11px;font-size:13px;color:#7A4A10}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:3px 12px;font-size:13px} .kv dt{color:var(--muted)} .kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--ctl);background:var(--paper);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
.chip:hover{background:var(--sel)}
.chip.on{background:var(--soft);border-color:var(--accent);color:var(--strong)}
.chip .x{color:var(--muted)} .chip.fil{background:var(--soft);border-color:transparent;color:var(--strong)}
.lnk{background:none;border:0;padding:0;color:var(--link);cursor:pointer;font-size:12px;text-decoration:underline}
.card.sl{box-shadow:inset 0 0 0 1px var(--accent)}
.card .stat{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.card .stat b{font:500 18px var(--mono);color:var(--strong)}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag.btn{cursor:pointer;background:var(--paper)} .tag.btn:hover{background:var(--sel)}
.slbtn{border:1px solid var(--ctl);background:var(--paper);border-radius:5px;font-size:11px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.slbtn.on{background:var(--soft);border-color:var(--accent);color:var(--strong)}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.field select,.field input{width:100%;padding:5px 7px;border:1px solid var(--ctl);border-radius:6px;background:var(--paper)}
.planbar{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.more{display:block;margin:10px auto 0;padding:5px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);cursor:pointer}
.empty{padding:26px;text-align:center;color:var(--muted)}
/*__FILTERBAR_CSS__*/
.xmain{display:flex;flex-direction:column;gap:12px;min-width:0}
.answer{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--rule2)}
.answer b{font:600 22px/1 var(--body);color:var(--strong);letter-spacing:-.02em}
.card h3.ds{font-size:16px}
.cstat{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.cstat b{font:600 18px var(--body);color:var(--strong);letter-spacing:-.02em}
.brandlogos{display:flex;align-items:center;gap:14px}
.brandlogos img{height:30px;width:auto;display:block;mix-blend-mode:multiply}
.brandlogos .lw{height:34px}

footer{font-size:12.5px;color:var(--muted);max-width:80ch;margin-top:30px}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}.claim{font-size:24px}.hero .claim{font-size:30px}main{padding:0 16px 60px}.top-in{padding:10px 16px}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brandlogos"><img src="/*__LOGO_DYN__*/" alt="DYNAMIC"><h1 id="ptitle">Data Universe</h1></div><nav class="sitenav" id="sitenav" aria-label="Site"></nav><span class="small muted" id="src"></span><img class="lw" src="/*__LOGO_LOEWE__*/" alt="LOEWE: Exzellente Forschung für Hessens Zukunft" style="height:34px;width:auto;mix-blend-mode:multiply;margin-left:auto"><nav class="ch" id="nav" aria-label="Chapters"></nav></div></header>
<main id="main"></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Dataset sheet"></aside>
<div id="tt" role="tooltip"></div>
<script>
const D=/*__DATA__*/null;
const PAGE=/*__PAGE__*/"story";
const LINKS=/*__LINKS__*/{home:"index.html",explore:"explore.html",catalogue:"catalogue.html"};
const CATALOGUE=LINKS.catalogue;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const fmt=n=>n==null?"–":Math.round(n).toLocaleString("en");
const uniq=a=>[...new Set(a)];
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const PAP=Object.fromEntries(D.papers.map(p=>[p.id,p])),DSB=Object.fromEntries(D.datasets.map(d=>[d.id,d]));
const S=D.samples;S.forEach(s=>{s.P=PAP[s.p];s.D=DSB[s.ds]});
const FAM=D.families,FAMOF={},FAML={},FCOL={};FAM.forEach(f=>{FAML[f.id]=f.l;FCOL[f.id]=`var(--f-${f.id})`;f.m.forEach(m=>FAMOF[m]=f.id)});
const MODS=FAM.flatMap(f=>f.m);
const POOL=new Set(["Consortium","Registry","Meta-analysis pool"]);
const isPool=s=>POOL.has(s.k)||s.D.pool;
/* dominant family: the rarest family a sample holds, so multimodal samples show what makes them special */
const DOM=["img","bio","digital","ephys","lang","cog","clin"];
const dom=s=>{const f=new Set(s.m.map(m=>FAMOF[m]));return DOM.find(x=>f.has(x))||null};
const famColor=s=>{const f=dom(s);return f?FCOL[f]:"var(--faint)"};
function agg(samples){const m=new Map();samples.forEach(s=>{(m.get(s.ds)||m.set(s.ds,[]).get(s.ds)).push(s)});
  return [...m.entries()].map(([id,ss])=>{const d=DSB[id],ns=ss.map(x=>x.n).filter(x=>x!=null),fs=ss.filter(x=>x.f!=null&&x.n).sort((a,b)=>b.n-a.n)[0]||ss.find(x=>x.f!=null),ag=ss.filter(x=>x.a0!=null||x.a1!=null);
    return{id,d,ss,n:ns.length?Math.max(...ns):null,papers:uniq(ss.map(x=>x.p)),years:uniq(ss.map(x=>x.P.y)).sort(),mods:uniq(ss.flatMap(x=>x.m)),conds:uniq(ss.flatMap(x=>x.c)),ins:uniq(ss.flatMap(x=>x.insn)),f:fs?fs.f:null,a0:ag.some(x=>x.a0!=null)?Math.min(...ag.filter(x=>x.a0!=null).map(x=>x.a0)):null,a1:ag.some(x=>x.a1!=null)?Math.max(...ag.filter(x=>x.a1!=null).map(x=>x.a1)):null,am:(ss.find(x=>x.am!=null)||{}).am??null,lon:ss.some(x=>x.lon),pool:d.pool}})}
const deDup=ag=>ag.filter(a=>!a.pool&&a.n!=null).reduce((t,a)=>t+a.n,0);
const ALL=agg(S),TOTAL=deDup(ALL);
const ageText=a=>a.a0!=null&&a.a1!=null?`${a.a0}–${a.a1} y`:a.a0!=null?`from ${a.a0} y`:a.a1!=null?`up to ${a.a1} y`:a.am!=null?`mean ${a.am} y`:"age not reported";
function fp(mods,sz=10){const has=new Set(mods);let x=0,o="";const g=2,gg=7;
  FAM.forEach(f=>{f.m.forEach(m=>{o+=`<rect x="${x}" y="0" width="${sz}" height="${sz}" rx="2" fill="${has.has(m)?FCOL[f.id]:"var(--rule2)"}"${has.has(m)?"":` stroke="var(--rule)" stroke-width=".5"`}><title>${esc(m)}${has.has(m)?"":" (not used)"}</title></rect>`;x+=sz+g});x+=gg-g});
  return `<svg width="${x}" height="${sz}" role="img" aria-label="Modalities: ${esc(mods.join(", ")||"none")}">${o}</svg>`}
const famLegend=(extra="")=>`<div class="legend">${FAM.map(f=>`<span><i style="background:${FCOL[f.id]}"></i>${esc(f.l)}</span>`).join("")}${extra}</div>`;
/* ---------- chapters ---------- */
const CH=[["universe","Universe"],["breadth","Breadth"],["together","Together"],["cohorts","Cohorts"],["people","People"],["spectrum","Spectrum"],["growth","Growth"],["possible","Possible"],["explore","Explore"]];
$("sitenav").innerHTML=`<a href="${LINKS.home}" class="${PAGE==="story"?"on":""}">Story</a><a href="${LINKS.explore}" class="${PAGE==="explore"?"on":""}">Explorer</a><a href="${LINKS.catalogue}">Catalogue</a>`;
$("nav").innerHTML=PAGE==="story"?CH.filter(c=>c[0]!=="explore").map(c=>`<a href="#${c[0]}">${c[1]}</a>`).join(""):"";
const modsUsed=uniq(S.flatMap(s=>s.m)).length,condsUsed=uniq(S.flatMap(s=>s.c)).length,ctry=uniq(S.flatMap(s=>s.ct)).length,inst=uniq(S.flatMap(s=>s.insn)).length,named=D.datasets.filter(d=>d.named).length,multi=S.filter(s=>uniq(s.m.map(m=>FAMOF[m])).length>=2).length;
const yrs=uniq(D.papers.map(p=>p.y)).sort();
const STORY=`
<section class="chapter hero" id="universe"><div class="eyebrow">Every analysed sample, in one picture</div><div class="herohead">
 <h2 class="claim">Papers from the centre have analysed <span class="hi">${fmt(TOTAL)} people</span> across ${D.datasets.length} datasets and ${modsUsed} kinds of data.</h2>
 <p class="lede">One circle per analysed sample, from the full text of ${D.meta.papers} papers (${yrs[0]}–${yrs[yrs.length-1]}). Area = participants analysed. Colour = the most distinctive data family the sample holds, so a cohort with brain imaging shows blue even when it also has questionnaires. Hollow circles are consortia, registries and meta-analytic pools: shown, never counted. Regroup to see the same people by condition, data family, dataset type, age or year. Click any circle for its dataset sheet and the sentence each number comes from.</p>
 <p class="lede" style="margin-top:10px"><b>Looking for the tool?</b> The <a href="${LINKS.explore}">Explorer</a> filters these datasets, compares them and drafts a data request; the <a href="${LINKS.catalogue}">Catalogue</a> adds the coverage map, participant charts, instrument network and method notes.</p></div>
 <div class="viz"><header><span class="seg" id="ugroup"></span><span class="hint">Hover a circle. Labels show samples per group.</span></header><div id="uni"></div>${famLegend(`<span><i class="hollow"></i>Pooled, not counted</span>`)}</div>
 <div class="stats">
  <div class="stat"><b>${fmt(TOTAL)}</b><span>participants, largest n per dataset, pools excluded</span></div>
  <div class="stat"><b>${D.datasets.length}</b><span>datasets, ${named} of them named</span></div>
  <div class="stat"><b>${S.length}</b><span>analysed samples in ${D.papers.filter(p=>S.some(s=>s.p===p.id)).length} empirical papers</span></div>
  <div class="stat"><b>${modsUsed}</b><span>data modalities in ${FAM.length} families</span></div>
  <div class="stat"><b>${multi}</b><span>samples combine two or more data families</span></div>
  <div class="stat"><b>${inst}</b><span>named instruments and scales</span></div>
  <div class="stat"><b>${condsUsed}</b><span>condition groups, plus healthy controls</span></div>
  <div class="stat"><b>${ctry}</b><span>countries of recruitment</span></div>
 </div></section>
<section class="chapter" id="breadth"><div class="eyebrow">Breadth</div><h2 class="claim">From brain scans to smartphone sensors: <span class="hi">${modsUsed} modalities</span>, seven families.</h2>
 <p class="lede">Each bar is one modality, its length the number of analysed samples that used it. Questionnaires and interviews carry the most weight, as in any clinical field, but the ring also shows diffusion MRI, EEG, microbiome, genetics, actigraphy and speech recordings already in play.</p>
 <div class="grid2"><div class="viz"><header><h3>Samples per modality</h3></header><div id="ring"></div></div>
 <div><div class="fam-strip" id="famstrip"></div></div></div></section>
<section class="chapter" id="together"><div class="eyebrow">Together</div><h2 class="claim"><span class="hi">${multi} samples</span> pair at least two data families, which is where dynamic models start.</h2>
 <p class="lede">A chord links two families whenever one sample holds both. Ribbon width = samples. The Clinical family touches everything; the strongest bridges run to neuroimaging and cognitive tasks. Biological and digital data pair with the clinic but rarely with each other yet, which is one gap a second funding period could close.</p>
 <div class="grid2"><div class="viz"><header><h3>Data families that co-occur in one sample</h3></header><div id="chord"></div></div>
 <div class="viz"><header><h3>Richest combinations</h3><span class="hint">Samples holding three or more families.</span></header><div id="rich"></div></div></div></section>
<section class="chapter" id="cohorts"><div class="eyebrow">Cohorts</div><h2 class="claim">A few deep cohorts carry much of the work, and <span class="hi">they are not independent</span>.</h2>
 <p class="lede">The datasets most often returned to. Papers per year, largest analysed n, and the modality fingerprint across all their papers. Findings from the same cohort should be read as one sample, not as replications; that is why totals never sum across papers.</p>
 <div class="grid3" id="featured"></div></section>
<section class="chapter" id="people"><div class="eyebrow">People</div><h2 class="claim">Mostly adults in their twenties and thirties; <span class="hi">children, adolescents and older adults</span> are where the map thins.</h2>
 <p class="lede">Left: each sample at its mean age and share female, area = n. Right: how many samples report a mean age in each five-year band. The empty right side of the chart is as informative as the full middle.</p>
 <div class="grid2"><div class="viz"><header><h3>Mean age and share female, per sample</h3></header><div id="scat"></div>${famLegend()}</div>
 <div class="viz"><header><h3>Samples by mean age</h3></header><div id="agebins"></div></div></div></section>
<section class="chapter" id="spectrum"><div class="eyebrow">Spectrum</div><h2 class="claim">Depression and anxiety dominate; psychosis, bipolar and autism follow; <span class="hi">${D.facets.cond.filter(c=>S.filter(s=>s.c.includes(c)).length<5).length} conditions</span> have fewer than five samples.</h2>
 <p class="lede">Samples per condition group, with participants de-duplicated by dataset beside each bar. A sample listing several conditions counts in each row.</p>
 <div class="viz"><div id="spec"></div></div></section>
<section class="chapter" id="growth"><div class="eyebrow">Growth</div><h2 class="claim">Output has more than doubled since 2024, and <span class="hi">the mix is shifting</span> towards imaging, biology and digital data.</h2>
 <p class="lede">Analysed samples per publication year, coloured by dominant data family. ${yrs[yrs.length-1]} is a partial year.</p>
 <div class="grid2"><div class="viz"><header><h3>Samples per year by data family</h3></header><div id="grow"></div>${famLegend()}</div>
 <div class="viz"><header><h3>What papers say about sharing their data</h3><span class="hint">All ${D.meta.papers} papers.</span></header><div id="access"></div></div></div></section>
<section class="chapter" id="possible"><div class="eyebrow">Possible</div><h2 class="claim">What you could pool tomorrow, <span class="hi">from data that already exists</span>.</h2>
 <p class="lede">Each tile asks one question of the catalogue: which datasets have this condition and this data, across all their papers? The number is an upper bound (largest n per dataset, overlap unchecked), and the planner in the full catalogue lets you add instruments, age groups and a minimum n.</p>
 <div class="grid3" id="recipes"></div></section>

function layout(W){const g=new Map();UN.forEach(n=>{const k=keyOf[ukey](n.s);(g.get(k)||g.set(k,[]).get(k)).push(n)});
  const groups=[...g.entries()].map(([k,ns])=>({k,ns,R:Math.sqrt(ns.reduce((t,n)=>t+(n.r+1.6)**2,0))*1.22+10})).sort((a,b)=>b.ns.length-a.ns.length);
  const GAP=26,LH=36,labW=c=>Math.max(c.R*2,Math.min(30,Math.max(c.k.length,16))*7.2+10);
  groups.forEach(c=>c.w=labW(c)+GAP);

  let y=0;rows.forEach(r=>{const h=d3.max(r,c=>c.R)*2+LH,tw=d3.sum(r,c=>c.w);let x=(W-tw)/2;r.forEach(c=>{c.cx=x+c.w/2;c.cy=y+LH+d3.max(r,d=>d.R);x+=c.w});y+=h+14});

  const opt=(arr,v,e="Any")=>`<option value="">${e}</option>`+arr.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("");const shortl=[...sl].map(id=>ALL.find(x=>x.id===id)).filter(Boolean);
  $("plan").innerHTML=`<header><h3>Pooling planner</h3><span class="hint">State what you need; the planner works per dataset, across all its papers, so a modality may come from a different paper of that cohort. Check with the holders whether both exist for the same people.</span></header>
  <div class="planbar"><div class="field"><label for="pc">Condition</label><select id="pc">${opt(D.facets.cond,P.cond)}</select></div><div class="field"><label for="pm1">Needs modality</label><select id="pm1">${opt(MODS,P.m1)}</select></div><div class="field"><label for="pm2">and modality</label><select id="pm2">${opt(MODS,P.m2)}</select></div><div class="field"><label for="pi">and instrument</label><select id="pi">${opt(allIns,P.inst)}</select></div><div class="field"><label for="pa">Age group</label><select id="pa">${opt(D.facets.age,P.age)}</select></div><div class="field"><label for="pn">Minimum n per dataset</label><input id="pn" type="number" min="0" value="${P.min}"></div><label class="fnote"><input id="pl" type="checkbox" ${P.lon?"checked":""}> Longitudinal only</label><label class="fnote"><input id="pp" type="checkbox" ${P.nopool?"checked":""}> Leave out consortia and pools</label></div>
  <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"><div class="stat"><b>${a.length}</b><span>datasets meet this</span></div><div class="stat"><b>≤ ${fmt(ub)}</b><span>upper bound on pooled n: largest n per dataset, overlap unchecked</span></div><div class="stat"><b>${topI.filter(i=>insCnt[i]===a.length).length||0}</b><span>instruments common to all${a.length?" "+a.length:""}, as reported</span></div></div>
  <div style="display:flex;gap:10px;align-items:baseline;margin:8px 0 6px"><h3 style="font-size:14px">Candidates</h3><button class="slbtn" id="addall">Shortlist all</button></div><div class="scroll">${a.length?`<table class="t"><thead><tr><th>Dataset</th><th class="n">Largest n</th><th>Holder or contact</th><th>Modalities</th><th>Access stated</th><th></th></tr></thead><tbody>${a.map(x=>`<tr class="cl" data-ds="${esc(x.id)}" tabindex="0"><td style="color:var(--strong);font-weight:500">${esc(x.d.name)}</td><td class="n">${fmt(x.n)}</td><td class="small">${esc(holder(x))}</td><td>${fp(x.mods,8)}</td><td class="small">${esc(uniq(x.ss.map(s=>s.P.ac)).join("; "))}</td><td><button class="slbtn ${sl.has(x.id)?"on":""}" data-sl="${esc(x.id)}">${sl.has(x.id)?"Listed":"Shortlist"}</button></td></tr>`).join("")}</tbody></table>`:`<div class="empty">No dataset meets all of this. Relax one requirement.</div>`}</div>
  ${a.length>1&&topI.length?`<h3 style="font-size:14px;margin:14px 0 4px">Instrument overlap</h3><p class="hint">Reported instruments, grouped into families; columns on the left are shared most widely.</p><div class="scroll"><table class="t"><thead><tr><th>Dataset</th>${topI.map(i=>`<th style="writing-mode:vertical-rl;transform:rotate(180deg);height:90px;text-align:left">${esc(i)}</th>`).join("")}</tr></thead><tbody>${a.slice(0,24).map(x=>`<tr><td>${esc(x.d.name)}</td>${topI.map(i=>`<td style="text-align:center">${x.ins.includes(i)?`<span aria-label="yes" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--mark)"></span>`:""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:""}
  <div style="display:flex;gap:10px;align-items:baseline;margin:16px 0 6px"><h3 style="font-size:14px">Shortlist (${shortl.length})</h3>${shortl.length?`<button class="slbtn" id="copyreq">Copy data request</button><button class="lnk" id="clrsl">Clear shortlist</button>`:""}</div>${shortl.length?compare(shortl):`<p class="small muted">Add datasets from any card or table to compare them here and draft a request to their holders.</p>`}`;
  const bind=(id,k,num)=>{$(id).onchange=e=>{P[k]=e.target.type==="checkbox"?e.target.checked:num?(+e.target.value||0):e.target.value;vPlan()}};bind("pc","cond");bind("pm1","m1");bind("pm2","m2");bind("pi","inst");bind("pa","age");bind("pn","min",1);bind("pl","lon");bind("pp","nopool");
  $("addall").onclick=()=>{a.forEach(x=>sl.add(x.id));renderX()};const cr=$("copyreq");if(cr){cr.onclick=()=>copy(request(shortl),"Draft request copied");$("clrsl").onclick=()=>{sl.clear();renderX()}}}
function renderX(){if(!$("facets"))return;renderFacets();renderActive();renderAnswer();vBrowse();vPlan()}
let qT;if($("q"))$("q").addEventListener("input",e=>{clearTimeout(qT);qT=setTimeout(()=>{F.text=e.target.value.trim();renderX()},160)});
function openPaper(id){const p=PAP[id],ss=S.filter(s=>s.p===id);openDrawer(`<span class="small muted">${esc(p.ty)}${p.ev!=="Full text"?` · ${esc(p.ev)}`:""}</span><h2 style="font-size:19px">${esc(p.t)}</h2><p class="small" style="margin:6px 0">${esc(p.auf)}</p><p class="small muted" style="margin:4px 0">${esc(p.j)}, ${p.y} · PMID <a href="https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/">${p.pmid}</a>${p.pmcid?` · <a href="https://pmc.ncbi.nlm.nih.gov/articles/${p.pmcid}/">${p.pmcid}</a>`:""}${p.doi?` · <a href="https://doi.org/${esc(p.doi)}">DOI</a>`:""}</p><p>${esc(p.tp)}</p><div class="tags"><span class="tag">${esc(p.de)}</span>${p.ap.map(a=>`<span class="tag">${esc(a)}</span>`).join("")}</div><h3>Analysed samples</h3>${ss.length?ss.map(s=>`<div class="small" style="margin-top:6px"><button class="lnk" data-ds="${esc(s.ds)}">${esc(s.D.name)}</button></div>`+sampleBox(s)).join(""):`<p class="small muted">No participant data of its own.</p>`}<h3>Data access, as stated</h3><div class="box"><b>${esc(p.ac)}</b>${p.url?` · <a href="${esc(p.url)}">${esc(p.url)}</a>`:""}${p.acq?`<blockquote>“${esc(p.acq)}”</blockquote>`:""}${p.pre?`<div style="margin-top:4px">Pre-registered${p.reg?`: ${esc(p.reg)}`:""}</div>`:""}${p.code?`<div style="margin-top:4px">Code available</div>`:""}</div>`)}
/* ---------- drawer ---------- */
function openDrawer(html){const d=$("drawer");d.innerHTML=`<button class="close" id="dclose">Close</button>`+html;d.classList.add("on");$("scrim").classList.add("on");d.scrollTop=0;$("dclose").focus();$("dclose").onclick=closeDrawer}
function closeDrawer(){$("drawer").classList.remove("on");$("scrim").classList.remove("on")}
$("scrim").onclick=closeDrawer;
function sampleBox(s){const g=s.g.length?`<div class="small" style="margin-top:3px">${s.g.map(x=>`${esc(x.l)}${x.n!=null?` <span class="num">${x.n}</span>`:""}`).join(" · ")}</div>`:"";const qs=[s.nq,s.dq].filter(Boolean).concat(s.xq||[]);
  return `<div class="box"><a href="https://pubmed.ncbi.nlm.nih.gov/${s.P.pmid}/">${esc(s.P.au)} ${s.P.y}</a>. ${esc(s.P.t)}<br><b class="num" style="color:var(--strong)">n ${fmt(s.n)}</b>${s.nd?` <span class="tag">derived</span>`:""}${s.f!=null?` · ${s.f}% female`:""} · ${ageText({a0:s.a0,a1:s.a1,am:s.am})}${g}${qs.map(q=>`<blockquote>“${esc(q)}”</blockquote>`).join("")}${s.qn?`<div class="small muted" style="margin-top:4px">${esc(s.qn)}</div>`:""}<div style="margin-top:6px">${fp(s.m,9)}</div></div>`}
function openDS(id){const x=ALL.find(a=>a.id===id);if(!x)return;const d=x.d,t=D.tab1.find(t=>t.ds===id);
  openDrawer(`<span class="small muted">${esc(d.kind)}</span><h2>${esc(d.name)}</h2>${d.aliases.length?`<p class="small muted" style="margin:3px 0">Also written as: ${esc(d.aliases.join("; "))}</p>`:""}
  ${x.papers.length>1?`<div class="chips" style="margin:8px 0"><button class="slbtn ${sl.has(id)?"on":""}" data-sl="${esc(id)}">${sl.has(id)?"On shortlist":"Add to shortlist"}</button>${$("facets")?`<button class="slbtn" data-ds-filter="${esc(id)}">${F.ds.has(id)?"Remove from Explore filter":"Filter Explore to this dataset"}</button>`:`<a class="slbtn" style="display:inline-block" href="${LINKS.explore}">Open in Explore ↗</a>`}</div>
  <div class="notice" style="margin-top:8px">Analysed in ${x.papers.length} papers. Treat their findings as one sample, not as ${x.papers.length} replications.</div>`:""}
  <dl class="kv" style="margin-top:12px"><dt>Largest analysed n</dt><dd class="num">${x.pool?"("+fmt(x.n)+"), not counted in totals":fmt(x.n)}</dd>${t?`<dt>Size in proposal</dt><dd><span class="num">approx. ${fmt(t.n)}</span>, ${esc(t.dx)} <span class="small muted">(Tab. 1)</span></dd><dt>Responsible PI</dt><dd>${esc(t.pi)}</dd><dt>Proposal remark</dt><dd>${esc(t.note)}</dd>`:""}<dt>Conditions</dt><dd>${esc(x.conds.join(", ")||"–")}</dd><dt>Age</dt><dd>${ageText(x)}</dd><dt>Countries</dt><dd>${esc(uniq(x.ss.flatMap(s=>s.ct)).join(", ")||"–")}</dd><dt>Instruments</dt><dd>${esc(x.ins.join(", ")||"–")}</dd></dl>
  <h3>Modalities across its papers</h3>${fp(x.mods,12)}<div class="small muted" style="margin-top:4px">${esc(x.mods.join(", ")||"none coded")}</div>
  <h3>Every paper that analysed it</h3>${x.ss.sort((a,b)=>b.P.y-a.P.y).map(sampleBox).join("")}<p class="small" style="margin-top:14px"><a href="${LINKS.catalogue}">Open the full catalogue</a> for coverage map, participant charts and instrument network.</p>`)}
/* ---------- events ---------- */
function showTip(e,html){const t=$("tt");t.innerHTML=html;t.style.display="block";const r=t.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+12;if(x+r.width>innerWidth-8)x=e.clientX-r.width-12;if(y+r.height>innerHeight-8)y=e.clientY-r.height-10;t.style.left=x+"px";t.style.top=y+"px"}
document.addEventListener("mousemove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)showTip(e,el.dataset.tip);else if(!(e.target.closest&&e.target.closest("#uni circle")))$("tt").style.display="none"});
document.addEventListener("click",e=>{const t=e.target,c=s=>t.closest&&t.closest(s);let el;if(c("a"))return;
 if(el=c("[data-sl]")){e.stopPropagation();const i=el.dataset.sl;sl.has(i)?sl.delete(i):sl.add(i);if($("drawer").classList.contains("on")&&c("#drawer"))openDS(i);renderX();return}
 if(el=c("[data-ds-filter]")){const i=el.dataset.dsFilter;F.ds.has(i)?F.ds.delete(i):F.ds.add(i);closeDrawer();renderX();if($("explore"))$("explore").scrollIntoView();return}
 if(el=c("[data-modmode]")){F.modMode=el.dataset.modmode;renderX();return}
 if(el=c("[data-unit]")){unit=el.dataset.unit;limit=24;renderX();return}
 if(el=c("[data-layout]")){xlayout=el.dataset.layout;renderX();return}
 if(el=c("[data-sort]")){const k=el.dataset.sort;tblSort=tblSort[0]===k?[k,-tblSort[1]]:[k,-1];renderX();return}
 if(el=c("[data-recipe]")){F=blank();XRECIPES[+el.dataset.recipe][1]();$("q").value="";renderX();return}
 if(el=c("[data-clr]")){const k=el.dataset.clr;if(k==="all"){F=blank();$("q").value=""}else if(k==="n"){F.nmin=F.nmax=null}else if(k==="text"){F.text="";$("q").value=""}else F[k]=false;renderX();return}
 if(el=c("[data-tog]")){const k=el.dataset.tog,v=el.dataset.v;F[k].has(v)?F[k].delete(v):F[k].add(v);renderX();return}
 if(el=c("[data-paper]")){openPaper(el.dataset.paper);return}
 if(el=c("[data-ds]")){openDS(el.dataset.ds);return}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();if(e.key==="Enter"&&e.target.matches&&e.target.matches("[data-ds],[data-paper]")&&e.target.tagName!=="BUTTON")e.target.click()});
const io=new IntersectionObserver(es=>{es.forEach(x=>{if(x.isIntersecting)document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+x.target.id))})},{rootMargin:"-45% 0px -50% 0px"});
function renderAll(first){if(!$("uni"))return;universe(first);ring();chord();people();spectrum();growth()}
renderAll(true);if($("featured")){featured();recipes()}if($("facets"))renderX();
document.querySelectorAll("section.chapter").forEach(s=>io.observe(s));
let rT;addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(()=>renderAll(true),200)});
</script>
