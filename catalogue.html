<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DYNAMIC Data Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js" integrity="sha384-SM54CE5h+qdDI046d2Y5ym7wq1kq4uxcQ1cqGq5/+5jrE5tPLeDJSq711Q8sIska" crossorigin="anonymous"></script>
<style>
/* Layout: a library catalogue. Sticky header + one filter rail scoping every view; dataset is the unit, each carries a fixed-position modality fingerprint.
   Theme: Ayu Light Bordered (ayu@8.0.1 light.js): one editor surface, ui.line hairlines, orange common.accent. Type: Geist / Geist Mono. Single light theme by choice. */
:root{
  --paper:#FCFCFC; --ink:#5C6166; --strong:#2E3338; --muted:#787B80; --faint:#ADAEB1; --rule:#6B7D8F1F; --rule2:#6B7D8F14; --ctl:#6B7D8F40;
  --accent:#FFAA33; --accent-ink:#9A5B00; --link:#2A7DBB; --mark:#399EE6; --soft:#FFAA3326; --sel:#56728F1F; --warn:#B86A14; --warnbg:#FA8D3E1F; --ok:#3F8A1F;
  --f-img:#399EE6; --f-ephys:#FA8D3E; --f-digital:#4CBF99; --f-bio:#A37ACC; --f-clin:#86B300; --f-cog:#55B4D4; --f-lang:#F07171;
  --display:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--link)}
h1,h2,h3{color:var(--strong);text-wrap:balance;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}
header.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{display:flex;flex-direction:column;gap:8px;padding:12px 20px 0;max-width:1640px;margin:0 auto}
.brand{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
h1{font:600 21px/1.15 var(--display);letter-spacing:-.02em}
.brand .src{margin-left:auto;font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:-1px}
nav.tabs a{padding:7px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
nav.tabs a:hover{color:var(--strong)}
nav.tabs a.on{color:var(--strong);border-bottom-color:var(--accent)}
.wrap{display:grid;grid-template-columns:272px minmax(0,1fr);max-width:1640px;margin:0 auto}
aside.rail{border-right:1px solid var(--rule);padding:14px 14px 40px 20px;position:sticky;top:96px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}
main{padding:14px 20px 60px;min-width:0;display:flex;flex-direction:column;gap:14px}
.answer{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--rule2)}
.answer b{font:500 20px/1 var(--mono);color:var(--strong)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--ctl);background:var(--paper);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
.chip:hover{background:var(--sel)}
.chip.on{background:var(--soft);border-color:var(--accent);color:var(--strong)}
.chip .x{color:var(--muted)} .chip.fil{background:var(--soft);border-color:transparent;color:var(--strong)}
.lnk{background:none;border:0;padding:0;color:var(--link);cursor:pointer;font-size:12px;text-decoration:underline}
.search{width:100%;padding:7px 10px;border:1px solid var(--ctl);border-radius:7px;background:var(--paper);margin-bottom:10px}
.fgroup{border-top:1px solid var(--rule2);padding:9px 0}
.fgroup>summary{cursor:pointer;font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);list-style-position:outside}
.frow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:6px;align-items:center;width:100%;border:0;background:none;padding:2px 3px;border-radius:4px;cursor:pointer;text-align:left;font-size:13px;min-height:24px}
.frow:hover{background:var(--sel)}
.frow.on{background:var(--soft);color:var(--strong);font-weight:500}
.frow.zero{color:var(--faint)}
.frow .sw{width:10px;height:10px;border-radius:2px;background:var(--faint)}
.frow .ct{font:12px var(--mono);color:var(--muted)}
.famh{font-weight:600;color:var(--strong)}
.indent{margin-left:12px}
.fnote{display:flex;gap:6px;align-items:center;font-size:12px;margin:5px 0 3px}
.seg{display:inline-flex;border:1px solid var(--ctl);border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;padding:2px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--soft);color:var(--strong);font-weight:500}
.rng{display:flex;gap:6px;align-items:center;margin-top:6px}
.rng input[type=number]{width:74px;padding:3px 5px;border:1px solid var(--rule);border-radius:5px;font:12px var(--mono)}
.panel{border:1px solid var(--rule);border-radius:10px;padding:14px;min-width:0}
.panel>header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:8px}
.panel h2{font:600 16px/1.25 var(--display);letter-spacing:-.01em}
.hint{font-size:12px;color:var(--muted);max-width:75ch}
.grid2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.scroll{overflow-x:auto}
.tile{border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.tile b{display:block;font:600 23px/1.15 var(--body);letter-spacing:-.02em;color:var(--strong)}
.tile span{font-size:12px;color:var(--muted)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(308px,1fr))}
.card{border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--paper);text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card.sl{box-shadow:inset 0 0 0 1px var(--accent)}
.card h3{font:600 15px/1.25 var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}
.card .stat{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.card .stat b{font:500 18px var(--mono);color:var(--strong)}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.tag.t1{border-color:var(--accent);color:var(--accent-ink)}
.tag.warn{border-color:transparent;background:var(--warnbg);color:var(--warn)}
.tag.btn{cursor:pointer;background:var(--paper)} .tag.btn:hover{background:var(--sel)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.slbtn{border:1px solid var(--ctl);background:var(--paper);border-radius:5px;font-size:11px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.slbtn.on{background:var(--soft);border-color:var(--accent);color:var(--strong)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:var(--paper);text-align:left;font-weight:600;font-size:12px;color:var(--muted);border-bottom:1px solid var(--rule);padding:5px 8px;white-space:nowrap}
table.t th[data-sort]{cursor:pointer} table.t th[data-sort]:hover{color:var(--strong)}
table.t td{border-bottom:1px solid var(--rule2);padding:5px 8px;vertical-align:top}
table.t tr.cl{cursor:pointer} table.t tr.cl:hover td{background:var(--sel)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
svg text{font-family:var(--body);fill:var(--ink)}
svg .mono{font-family:var(--mono)}
.hit{cursor:pointer}
#tt{position:fixed;z-index:60;pointer-events:none;background:var(--strong);color:#fff;font-size:12px;line-height:1.35;padding:6px 8px;border-radius:6px;max-width:330px;display:none}
#tt b{color:#fff}
.scrim{position:fixed;inset:0;background:#2E33382e;z-index:40;display:none}
.scrim.on{display:block}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--paper);border-left:1px solid var(--rule);z-index:50;transform:translateX(102%);transition:transform .16s;overflow:auto;padding:18px 20px 40px;visibility:hidden}
aside.drawer.on{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){aside.drawer{transition:none}}
aside.drawer h2{font:600 21px/1.2 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
aside.drawer h3{font:600 14px var(--body);margin:16px 0 6px}
.close{float:right;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:2px 9px;cursor:pointer}
.box{border:1px solid var(--rule);border-radius:8px;padding:9px 11px;margin:7px 0}
blockquote{margin:6px 0 0;padding:0 0 0 9px;border-left:2px solid var(--rule);font-size:12.5px;color:var(--ink)}
.notice{background:var(--warnbg);border-radius:8px;padding:8px 11px;font-size:13px;color:#7A4A10}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:3px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--strong);color:#fff;padding:7px 12px;border-radius:7px;z-index:70;font-size:13px;display:none}
.toast.on{display:block}
dialog{border:1px solid var(--rule);border-radius:10px;max-width:640px;width:90%}
dialog textarea{width:100%;height:240px;font:12px var(--mono)}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.field select,.field input{width:100%;padding:5px 7px;border:1px solid var(--ctl);border-radius:6px;background:var(--paper)}
.planbar{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.more{display:block;margin:10px auto 0;padding:5px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);cursor:pointer}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.empty{padding:26px;text-align:center;color:var(--muted)}
@media(max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr)}aside.rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule);padding:12px 16px}.grid2{grid-template-columns:minmax(0,1fr)}main{padding:12px 16px 40px}.brand .src{margin-left:0}.top-in{padding:10px 16px 0}}
@media(max-width:1000px){header.top{position:static}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><h1>DYNAMIC Data Catalogue</h1><span class="muted small">Which cohorts, data types and participants the centre's papers actually analysed</span><span class="src" id="src"></span></div>
  <nav class="tabs" aria-label="Views" id="tabs"></nav>
</div></header>
<div class="wrap">

  <main>
    <div class="answer" id="answer"></div>
    <div class="chips" id="active"></div>
    <div id="view" style="display:flex;flex-direction:column;gap:14px;min-width:0"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Details"></aside>
<div id="tt" role="tooltip"></div>
<div class="toast" id="toast" role="status"></div>
<dialog id="copydlg"><p class="small">Copying was blocked here. Select the text and copy it yourself.</p><textarea id="copytxt" aria-label="Text to copy"></textarea><p><button class="slbtn" id="copyclose">Close</button></p></dialog>

 ${a.length>1&&topI.length?`<section class="panel"><header><h2>Instrument overlap</h2><span class="hint">Reported instruments, grouped into families. Columns on the left are shared most widely; these are the phenotypes you can harmonise without bridging.</span></header><div class="scroll"><table class="t"><thead><tr><th>Dataset</th>${topI.map(i=>`<th style="writing-mode:vertical-rl;transform:rotate(180deg);height:90px;text-align:left">${esc(i)}</th>`).join("")}</tr></thead><tbody>${a.slice(0,24).map(x=>`<tr><td>${esc(x.d.name)}</td>${topI.map(i=>`<td style="text-align:center">${x.ins.includes(i)?`<span aria-label="yes" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--mark)"></span>`:""}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`:""}
 <section class="panel"><header><h2>Shortlist (${shortl.length})</h2>${shortl.length?`<button class="slbtn" id="copyreq">Copy data request</button><button class="lnk" id="clrsl">Clear shortlist</button>`:""}</header>${shortl.length?compare(shortl):`<p class="small muted">Add datasets from any card or table to compare them here, and draft a request to their holders.</p>`}</section>`;
 const bind=(id,k,num)=>{$(id).onchange=e=>{P[k]=e.target.type==="checkbox"?e.target.checked:num?(+e.target.value||0):e.target.value;render()}};
 bind("pc","cond");bind("pm1","m1");bind("pm2","m2");bind("pi","inst");bind("pa","age");bind("pn","min",1);bind("pl","lon");bind("pp","nopool");
 $("addall").onclick=()=>{a.forEach(x=>sl.add(x.id));render()};
 const cr=$("copyreq");if(cr){cr.onclick=()=>copy(request(shortl),"Draft request copied");$("clrsl").onclick=()=>{sl.clear();render()}}}
function holder(x){if(x.d.tab1!=null&&x.d.tab1!==false){const t=D.tab1.find(t=>t.ds===x.id);if(t)return t.pi+" (Tab. 1)"}const p=x.ss.map(s=>s.P).sort((a,b)=>b.y-a.y)[0];return p?(p.la?p.la+" (last author, "+p.y+")":"see paper"):"see paper"}
function compare(list){const rows=[["Type",x=>esc(x.d.kind)],["Largest n",x=>fmt(x.n)],["Female",x=>x.f!=null?x.f+"%":"–"],["Age",x=>ageText(x)],["Longitudinal",x=>x.lon?"Yes":"Not reported"],["Papers",x=>x.papers.length],["Conditions",x=>esc(x.conds.join(", "))],["Modalities",x=>fp(x.mods,8)+`<div class="small muted" style="margin-top:3px">${esc(x.mods.join(", "))}</div>`],["Instruments",x=>esc(x.ins.join(", ")||"–")],["Holder or contact",x=>esc(holder(x))],["Access stated",x=>esc(uniq(x.ss.map(s=>s.P.ac)).join("; "))]];
 return `<div class="scroll"><table class="t"><thead><tr><th></th>${list.map(x=>`<th style="white-space:normal;min-width:190px;color:var(--strong)">${esc(x.d.name)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr><td class="muted small" style="white-space:nowrap">${r[0]}</td>${list.map(x=>`<td class="small">${r[1](x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function request(list){return `Subject: DYNAMIC data request: ${P.cond||"analysis"} ${[P.m1,P.m2].filter(Boolean).join(" + ")}\n\nDear colleagues,\n\nWe are planning an analysis of ${P.cond||"[population]"} using ${[P.m1,P.m2].filter(Boolean).join(" and ")||"[modalities]"}. The DYNAMIC catalogue lists the following datasets as candidates. Could you tell us whether these data exist for the same participants, and on what terms they could be shared?\n\n`+list.map(x=>`- ${x.d.name}, largest analysed n ${fmt(x.n)}. Contact: ${holder(x)}. Key paper: ${x.ss[0].P.au} ${x.ss[0].P.y}${x.ss[0].P.doi?`, https://doi.org/${x.ss[0].P.doi}`:""}`).join("\n")+`\n\nResearch question: [one sentence]\nVariables needed: [list]\n\nWith thanks,\n[name]`}
/* ---------- METHOD ---------- */
function vMethod(){const m=D.meta,q=m.qc,a=m.agree;
 $("view").innerHTML=`<div class="grid3"><div class="tile"><b>${m.papers}</b><span>papers in snapshot ${esc(m.snapshot)}</span></div><div class="tile"><b>${q.quotes}</b><span>verbatim quotes, all found in the source text by machine</span></div><div class="tile"><b>${m.fulltext}</b><span>papers read from full text; ${m.papers-m.fulltext} abstract or metadata only</span></div><div class="tile"><b>${a?a.n_exact+"%":"–"}</b><span>of largest n repeated exactly in a blind second extraction of ${a?a.papers:"–"} papers</span></div></div>
 <section class="panel"><header><h2>How to read these numbers</h2></header><div style="max-width:72ch;display:flex;flex-direction:column;gap:8px">
 <p style="margin:0"><b style="color:var(--strong)">Analysed, not collected.</b> Sample sizes are what a paper analysed. A cohort's real size may be larger, and Vollantrag Tab. 1 gives its planned size.</p>
 <p style="margin:0"><b style="color:var(--strong)">Participants are never summed across papers.</b> Totals take the largest n per dataset. Consortia, registries and meta-analytic pools are listed but not counted. Overlap between different datasets is not checked, so the total is an upper bound.</p>
 <p style="margin:0"><b style="color:var(--strong)">Every number has a source.</b> Sample sizes, sex and age sit inside a quote that a script found in the paper. Numbers computed from counts are marked as derived. The quote proves the sentence exists, not that it was read correctly. The second extraction below tests repeatability only, so spot-check any number you plan to rely on.</p>
 <p style="margin:0"><b style="color:var(--strong)">Access is what the paper states.</b> It is no statement of what the holder would share today. Holders come from Tab. 1; for other datasets the page shows the latest paper's last author as a starting point.</p>
 <p style="margin:0"><b style="color:var(--strong)">Preprints are excluded</b>, as in the rest of the DYNAMIC library.</p></div></section>
 <section class="panel"><header><h2>Second extraction, ${a?a.papers:"–"} randomly chosen papers</h2><span class="hint">A second agent read the same text packets without seeing the first result. Same model, same packets, so this measures repeatability: errors both make stay invisible. A later hand scan of the full texts corrected 12 dataset links and added 4 links from named cohorts into consortium or derived samples; this check flagged none of them, and for BANDA both passes made the same mistake.</span></header>${a?`<table class="t" style="max-width:720px"><thead><tr><th>Field</th><th class="n">Agreement</th><th>How measured</th></tr></thead><tbody>${a.rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="n">${r[1]}%</td><td class="small muted">${esc(r[2])}</td></tr>`).join("")}</tbody></table>`:`<p class="small muted">Not available.</p>`}</section>
 <section class="panel"><header><h2>Known gaps</h2></header><ul style="margin:0;padding-left:18px;max-width:75ch">${m.gaps.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></section>
 <section class="panel"><header><h2>What this mockup takes from the atlas proposals, and what it adds</h2></header><div class="scroll"><table class="t"><thead><tr><th>Idea</th><th>Source</th><th>Here</th></tr></thead><tbody>${m.lineage.map(r=>`<tr><td>${esc(r[0])}</td><td class="small muted">${esc(r[1])}</td><td class="small">${esc(r[2])}</td></tr>`).join("")}</tbody></table></div></section>`}
/* ---------- DRAWER ---------- */
function openDrawer(html){const d=$("drawer");d.innerHTML=`<button class="close" id="dclose">Close</button>`+html;d.classList.add("on");$("scrim").classList.add("on");d.scrollTop=0;$("dclose").focus();$("dclose").onclick=closeDrawer}
function closeDrawer(){$("drawer").classList.remove("on");$("scrim").classList.remove("on")}
$("scrim").onclick=closeDrawer;
function sampleBox(s,withPaper){const g=s.g.length?`<div class="small" style="margin-top:3px">${s.g.map(x=>`${esc(x.l)}${x.n!=null?` <span class="num">${x.n}</span>`:""}`).join(" · ")}</div>`:"";
 const qs=[s.nq,s.dq].filter(Boolean).concat(s.xq||[]);
 return `<div class="box">${withPaper?`<button class="lnk" data-paper="${s.p}" style="font-size:13px">${esc(s.P.au)} ${s.P.y}. ${esc(s.P.t)}</button><br>`:""}<span class="tag">${esc(s.role||"primary")}</span> <b class="num" style="color:var(--strong)">n ${fmt(s.n)}</b>${s.nd?` <span class="tag">derived</span>`:""}${s.f!=null?` · ${s.f}% female${s.fd?" (derived)":""}`:""} · ${ageText({a0:s.a0,a1:s.a1,am:s.am})}${s.am!=null&&s.asd!=null?` (mean ${s.am}, SD ${s.asd})`:""}${g}
 ${qs.map(q=>`<blockquote>“${esc(q)}”</blockquote>`).join("")}${s.qn?`<div class="small muted" style="margin-top:4px">${esc(s.qn)}</div>`:""}${s.ema?`<div class="small" style="margin-top:4px">EMA: ${esc(s.ema)}</div>`:""}${Object.keys(s.md||{}).length?`<div class="small muted" style="margin-top:4px">${Object.entries(s.md).map(([k,v])=>`${esc(k)}: ${esc(v)}`).join(" · ")}</div>`:""}</div>`}
function openDS(id){const x=agg(S).find(a=>a.id===id);if(!x)return;const d=x.d,t=D.tab1.find(t=>t.ds===id),feeds=D.feeds.filter(f=>f.from===id);
 openDrawer(`<span class="small muted">${esc(d.kind)}</span><h2>${esc(d.name)}</h2>${d.aliases.length?`<p class="small muted" style="margin:3px 0">Also written as: ${esc(d.aliases.join("; "))}</p>`:""}
 <div class="chips" style="margin:8px 0"><button class="slbtn ${sl.has(id)?"on":""}" data-sl="${esc(id)}">${sl.has(id)?"On shortlist":"Add to shortlist"}</button><button class="slbtn" data-ds-filter="${esc(id)}">${F.ds.has(id)?"Remove from filter":"Filter views to this dataset"}</button></div>
 ${x.papers.length>1?`<div class="notice">Analysed in ${x.papers.length} papers. Treat their findings as one sample, not as ${x.papers.length} replications.</div>`:""}
 <dl class="kv" style="margin-top:12px"><dt>Largest analysed n</dt><dd class="num">${x.pool?"("+fmt(x.n)+"), not counted in totals":fmt(x.n)}</dd>${t?`<dt>Size in proposal</dt><dd><span class="num">approx. ${fmt(t.n)}</span>, ${esc(t.dx)} <span class="small muted">(Tab. 1)</span></dd><dt>Responsible PI</dt><dd>${esc(t.pi)}</dd><dt>Proposal remark</dt><dd>${esc(t.note)} <span class="small muted">(translated)</span></dd><dt>Longitudinal (Tab. 1)</dt><dd>${t.long==="J"?"Yes":t.long==="T"?"Partly":"No"}</dd>`:`<dt>Contact to start with</dt><dd>${esc(holder(x))}</dd>`}
 <dt>Conditions</dt><dd>${esc(x.conds.join(", ")||"–")}</dd><dt>Age</dt><dd>${ageText(x)}</dd><dt>Countries</dt><dd>${esc(uniq(x.ss.flatMap(s=>s.ct)).join(", ")||"–")}</dd><dt>Sites</dt><dd>${esc(uniq(x.ss.flatMap(s=>s.st)).join(", ")||"–")}</dd><dt>Instruments</dt><dd>${esc(uniq(x.ss.flatMap(s=>s.ins)).join(", ")||"–")}</dd></dl>
 <h3>Modalities across its papers</h3>${fp(x.mods,12)}<div class="tags" style="margin-top:6px">${x.mods.map(m=>`<button class="tag btn" data-tog="mods" data-v="${esc(m)}">${esc(m)}</button>`).join("")}</div>
 ${feeds.length?`<h3>Also feeds</h3>${feeds.map(f=>{const s=S.find(z=>z.id===f.sample);return `<div class="box small"><button class="lnk" data-paper="${s.p}">${esc(s.D.name)} (${esc(s.P.au)} ${s.P.y})</button><blockquote>“${esc(f.quote)}”</blockquote></div>`}).join("")}`:""}
 <h3>Every paper that analysed it</h3>${x.ss.sort((a,b)=>b.P.y-a.P.y).map(s=>sampleBox(s,true)).join("")}`)}
function openPaper(id){const p=PAP[id],ss=S.filter(s=>s.p===id);
 openDrawer(`<span class="small muted">${esc(p.ty)}${p.ev!=="Full text"?` · ${esc(p.ev)}`:""}</span><h2 style="font-size:20px">${esc(p.t)}</h2><p class="small" style="margin:6px 0">${esc(p.auf)}</p><p class="small muted" style="margin:4px 0">${esc(p.j)}, ${p.y} · PMID <a href="https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/">${p.pmid}</a>${p.pmcid?` · <a href="https://pmc.ncbi.nlm.nih.gov/articles/${p.pmcid}/">${p.pmcid}</a>`:""}${p.doi?` · <a href="https://doi.org/${esc(p.doi)}">DOI</a>`:""}</p>
 <p>${esc(p.tp)}</p><div class="tags"><span class="tag">${esc(p.de)}</span>${p.ap.map(a=>`<button class="tag btn" data-tog="approach" data-v="${esc(a)}">${esc(a)}</button>`).join("")}</div>
 <h3>Analysed samples</h3>${ss.length?ss.map(s=>`<div class="small" style="margin-top:6px"><button class="lnk" data-ds="${esc(s.ds)}">${esc(s.D.name)}</button></div>`+sampleBox(s,false)).join(""):`<p class="small muted">No participant data of its own.</p>`}
 <h3>Data access, as stated</h3><div class="box small"><b>${esc(p.ac)}</b>${p.url?` · <a href="${esc(p.url)}">${esc(p.url)}</a>`:""}${p.acq?`<blockquote>“${esc(p.acq)}”</blockquote>`:""}${p.pre?`<div style="margin-top:4px">Pre-registered${p.reg?`: ${esc(p.reg)}`:""}</div>`:""}${p.code?`<div style="margin-top:4px">Code available</div>`:""}</div>`)}
/* ---------- global events ---------- */
function showTip(e,html){const t=$("tt");t.innerHTML=html;t.style.display="block";const r=t.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+12;if(x+r.width>innerWidth-8)x=e.clientX-r.width-12;if(y+r.height>innerHeight-8)y=e.clientY-r.height-10;t.style.left=x+"px";t.style.top=y+"px"}
document.addEventListener("mousemove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)showTip(e,el.dataset.tip);else if(!e.target.closest||!e.target.closest("#scatsvg"))$("tt").style.display="none"});
document.addEventListener("click",e=>{const t=e.target,c=s=>t.closest&&t.closest(s);let el;
 if(el=c("[data-sl]")){e.stopPropagation();const i=el.dataset.sl;sl.has(i)?sl.delete(i):sl.add(i);if($("drawer").classList.contains("on")&&c("#drawer"))openDS(i);render();return}
 if(el=c("[data-ds-filter]")){const i=el.dataset.dsFilter;F.ds.has(i)?F.ds.delete(i):F.ds.add(i);closeDrawer();render();return}
 if(el=c("[data-modmode]")){F.modMode=el.dataset.modmode;render();return}
 if(el=c("[data-unit]")){unit=el.dataset.unit;limit=36;render();return}
 if(el=c("[data-layout]")){layout=el.dataset.layout;render();return}
 if(el=c("[data-sort]")){const k=el.dataset.sort;tblSort=tblSort[0]===k?[k,-tblSort[1]]:[k,-1];render();return}
 if(el=c("[data-rowby]")){rowBy=el.dataset.rowby;render();return}
 if(el=c("[data-meas]")){measure=el.dataset.meas;render();return}
 if(el=c("[data-mt]")){matTable=el.dataset.mt==="1";render();return}
 if(el=c("[data-avail]")){availMode=el.dataset.avail;render();return}
 if(el=c("[data-recipe]")){F=blank();RECIPES[+el.dataset.recipe][1]();$("q").value="";render();return}
 if(el=c("[data-clr]")){const k=el.dataset.clr;if(k==="all"){F=blank();$("q").value=""}else if(k==="n"){F.nmin=F.nmax=null}else if(k==="text"){F.text="";$("q").value=""}else F[k]=false;render();return}
 if(el=c("[data-cell]")){const[r,m]=el.dataset.cell.split("|");F[rowBy].has(r)&&F.mods.has(m)?(F[rowBy].delete(r),F.mods.delete(m)):(F[rowBy].add(r),F.mods.add(m));render();return}
 if(el=c("[data-combo]")){const ms=el.dataset.combo.split("|"),same=F.modMode==="all"&&F.mods.size===ms.length&&ms.every(m=>F.mods.has(m));F.mods=new Set(same?[]:ms);F.modMode=same?"any":"all";render();return}
 if(el=c("[data-tog]")){const inDrawer=c("#drawer");toggle(el.dataset.tog,el.dataset.v);if(inDrawer)closeDrawer();return}
 if(el=c("[data-paper]")){openPaper(el.dataset.paper);return}
 if(el=c("[data-ds]")){openDS(el.dataset.ds);return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();if(e.key==="Enter"&&e.target.matches&&e.target.matches("[data-ds],[data-paper]")&&e.target.tagName!=="BUTTON")e.target.click()});
let qT;$("q").addEventListener("input",e=>{clearTimeout(qT);qT=setTimeout(()=>{F.text=e.target.value.trim();render()},160)});
const LINKS={"home": "index.html", "explore": "explore.html", "catalogue": "catalogue.html"};
$("src").innerHTML=`<a href="${LINKS.home}">Data Universe ↗</a> · <a href="${LINKS.explore}">Explore ↗</a> · Snapshot ${D.meta.snapshot} · ${D.meta.papers} papers · full-text extraction · every quote machine-checked`;
let rT;new ResizeObserver(()=>{clearTimeout(rT);rT=setTimeout(()=>{if(["landscape","people","connections"].includes(view))render()},180)}).observe(document.querySelector("main"));
route();
</script>
